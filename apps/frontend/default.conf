server {
  listen 8080;
  root /usr/share/nginx/html;

  gzip on;
  gzip_disable "msie6";

  gzip_vary on;
  gzip_proxied no-cache no-store private expired auth;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types text/plain application/javascript text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype;

  # nginx's bundled mime.types has no mapping for .mjs, so ES module workers
  # (e.g. pdf.worker.min.mjs) would be served as application/octet-stream and
  # rejected by the browser's strict module MIME check. Set the type for .mjs
  # only, without redefining the whole types map (a `types { }` block would
  # REPLACE the inherited mime.types and break .html/.css serving).
  location ~ \.mjs$ {
    default_type text/javascript;
  }

  location / {
    index index.html index.htm;
    try_files $uri $uri/ /index.html =200;
  }
}
