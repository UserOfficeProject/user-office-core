mutation updatePermissionRule(
  $role: String!
  $id: Int!
  $subject: String!
  $action: String!
  $conditions: String
  $isDbPermission: Boolean!
) {
  updatePermissionRule(
    role: $role
    id: $id
    subject: $subject
    action: $action
    conditions: $conditions
    isDbPermission: $isDbPermission
  ) {
    role
    id
    subject
    action
    conditions
    isDbPermission
  }
}
