query getProposalCoreBasic(
  $filter: ProposalsFilter
  $searchText: String
) {
  proposalsView(
    filter: $filter
    searchText: $searchText
  ) {
    proposalViews {
      primaryKey
      statusId
      proposalId
      callId
      submittedDate
      instruments {
        id
        name
        managerUserId
        managementTimeAllocation
      }
      fapInstruments {
        fapId
        instrumentId
      }
    }
    totalCount
  }
}
