mutation updateProposal(
  $proposalPk: Int!
  $title: String!
  $abstract: String!
  $users: [Int!]
  $proposerId: Int
  $editStartTime: DateTime
) {
  updateProposal(
    proposalPk: $proposalPk
    title: $title
    abstract: $abstract
    users: $users
    proposerId: $proposerId
    editStartTime: $editStartTime
  ) {
    primaryKey
    title
    abstract
    proposer {
      ...basicUserDetails
    }
    users {
      ...basicUserDetails
    }
  }
}
