mutation changeTechniqueProposalsStatus(
  $proposalPks: [Int!]!
  $workflowStatusId: Int!
  $statusActionsWorkflowConnectionId: Int
) {
  changeTechniqueProposalsStatus(
    changeProposalsStatusInput: {
      proposalPks: $proposalPks
      workflowStatusId: $workflowStatusId
      statusActionsWorkflowConnectionId: $statusActionsWorkflowConnectionId
    }
  )
}
