mutation updateVisitRegistration(
  $visitId: Int!
  $userId: Int!
  $startsAt: DateWithoutTimezone
  $endsAt: DateWithoutTimezone
) {
  updateVisitRegistration(
    visitId: $visitId
    userId: $userId
    startsAt: $startsAt
    endsAt: $endsAt
  ) {
    ...visitRegistration
    user {
      ...basicUserDetails
    }
    questionary {
      ...questionary
      isCompleted
    }
  }
}
