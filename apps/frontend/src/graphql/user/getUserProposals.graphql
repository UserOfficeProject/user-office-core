query getUserProposals(
  $first: Int, 
  $offset: Int
  $searchText: String
) {
  me {
    paginatedProposals(
      first: $first,
      offset: $offset
      searchText: $searchText
  ) {
      totalCount
      userProposals {
        primaryKey
        proposalId
        title
        status {
          ...status
        }
        publicStatus
        statusId
        created
        finalStatus
        notified
        submitted
        proposer {
          id
        }
        call {
          id
          shortCode
          isActive
          isActiveInternal
          referenceNumberFormat
          startCall
          endCall
          endCallInternal
        }
      }
    }
  }
}
