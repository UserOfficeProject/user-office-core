query getUserProposals(
  $first: Int, 
  $offset: Int,
  $orderByCollectionList: [OrderByCollection!],
) {
  me {
    paginatedProposals(
      first: $first, 
      offset: $offset,
      orderByCollectionList: $orderByCollectionList
    ) {
      totalCount
      userProposals {
        primaryKey
        proposalId
        title
        status {
          ...status
        }
        publicStatus
        statusId
        created
        finalStatus
        notified
        submitted
        proposer {
          id
        }
        call {
          id
          shortCode
          isActive
          isActiveInternal
          referenceNumberFormat
          startCall
          endCall
          endCallInternal
        }
      }
    }
  }
}
