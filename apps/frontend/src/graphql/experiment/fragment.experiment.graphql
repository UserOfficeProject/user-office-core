fragment experiment on Experiment {
  experimentPk
  experimentId
  startsAt
  endsAt
  scheduledEventId
  proposalPk
  status
  localContactId
  instrumentId
  createdAt
  updatedAt
  notes

  instrument {
    id
    name
    shortCode
    description
    managerUserId
    scientists {
      ...basicUserDetails
    }
  }
}
