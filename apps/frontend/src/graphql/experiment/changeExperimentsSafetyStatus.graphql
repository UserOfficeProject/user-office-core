mutation changeExperimentsSafetyStatus(
  $experimentSafetyPks: [Int!]!
  $workflowStatusId: Int!
  $statusActionsWorkflowConnectionId: Int
) {
  changeExperimentsSafetyStatus(
    changeExperimentsSafetyStatusInput: {
      experimentSafetyPks: $experimentSafetyPks
      workflowStatusId: $workflowStatusId
      statusActionsWorkflowConnectionId: $statusActionsWorkflowConnectionId
    }
  )
}
