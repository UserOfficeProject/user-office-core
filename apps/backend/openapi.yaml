paths:
  /account-activation/{email}:
    post:
      summary: Activate an account and send activation email
      description: Requires at least USER_OFFICE role OR an API key with ADMIN permissions
      operationId: sendActivationEmail
      tags:
      - account-activation
      parameters:
      - description: The email address of the user to send the activation email to
        name: email
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Activation email sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountActivationDTO"
        "400":
          description: Invalid email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "404":
          description: No account found with the specified email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "409":
          description: Active account found with the specified email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
      security:
      - Bearer: []
      - ApiKey: []
  /account-activation/{encryptedId}:
    put:
      summary: Activate an account by activation ID
      description: This endpoint is anonymous and does not require any authentication
      operationId: activateAccount
      tags:
      - account-activation
      parameters:
      - description: The encrypted activation ID
        name: encryptedId
        required: true
        in: path
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateAccountWrapperDTO"
        required: true
      responses:
        "200":
          description: Account activated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountActivationDTO"
        "400":
          description: Invalid activation ID or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "404":
          description: Activation ID not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "409":
          description: Account already activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "410":
          description: Activation expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "502":
          description: Failed to send email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
  /api-keys:
    get:
      summary: Get all API Keys
      description: Requires at least ADMIN role to access this endpoint please contact
        us using contact details provided in the documentation if you need to access
        this endpoint
      operationId: getAllApiKeys
      tags:
      - api-keys
      responses:
        "200":
          description: API Keys found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeyDTO"
      security:
      - Bearer: []
    post:
      summary: Create API Key
      description: "Requires at least SUPER_ADMIN role to access this endpoint, this\
        \ role is reserved for senior U&A personnel. Please contact us using contact\
        \ details provided in the documentation if you need to access this endpoint.This\
        \ endpoint ignores the token field if provided."
      operationId: createApiKey
      tags:
      - api-keys
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyDTO"
        required: true
      responses:
        "201":
          description: API Key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyDTO"
        "400":
          description: "Bad request is returned if no body is supplied or if service\
            \ name, contact and role are not provided"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
      security:
      - Bearer: []
  /api-keys/individual:
    delete:
      summary: Delete API Key by token
      description: "Requires at least SUPER_ADMIN role to access this endpoint, this\
        \ role is reserved for the U&A team leadplease contact us using contact details\
        \ provided in the documentation if you need to access this endpoint"
      operationId: softDeleteApiKey
      tags:
      - api-keys
      parameters:
      - description: The API key to delete
        required: true
        name: X-API-key
        in: header
        schema:
          type: string
      responses:
        "200":
          description: API Key deleted
        "404":
          description: API Key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
      security:
      - Bearer: []
    get:
      summary: Get API Key by token
      description: Requires at least ADMIN role or API-key to access this endpoint.
        If API key is used for auth it must be the same as the token supplied in the
        header X-API-key. If API-key auth is used it only allows to query the information
        about itself.
      operationId: getApiKeyByToken
      tags:
      - api-keys
      parameters:
      - description: The api key to search for
        required: true
        name: X-API-key
        in: header
        schema:
          type: string
      responses:
        "200":
          description: API Key found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyDTO"
        "400":
          description: Bad request is returned if no token is supplied in the header
            X-API-key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "403":
          description: Forbidden is returned if the token checked is different from
            the token used to access this endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "404":
          description: API Key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
      security:
      - Bearer: []
      - ApiKey: []
  /api-keys/{serviceName}:
    put:
      summary: Update API Key
      description: "Requires at least SUPER_ADMIN role to access this endpoint, this\
        \ role is reserved for senior U&A personnel. Please contact us using contact\
        \ details provided in the documentation if you need to access this endpoint.This\
        \ endpoint ignores the token field if provided."
      operationId: updateApiKeyDetails
      tags:
      - api-keys
      parameters:
      - description: Api Key's Service Name
        name: serviceName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyDTO"
        required: true
      responses:
        "200":
          description: API Key updated
          content:
            application/json:
              schema: {}
      security:
      - Bearer: []
  /basic-person-details:
    get:
      summary: Get all basic person details
      description: Requires an API key with the permission to get all basic person
        details
      operationId: getBasicPersonDetails
      tags:
      - basic-person-details
      parameters:
      - description: 'The fedId to search for '
        name: fedId
        in: query
        schema:
          type: array
          items:
            type: string
      - description: The surname to search for
        name: surname
        in: query
        schema:
          type: array
          items:
            type: string
      - description: List of emails to search for
        name: emails
        in: query
        schema:
          type: array
          items:
            type: string
      - description: List of userNumbers
        name: userNumbers
        in: query
        schema:
          type: array
          items:
            type: string
      - description: Search for people modified since this date
        name: fromDate
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Basic person details found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BasicPersonDetailsDTO"
        "400":
          description: "Invalid date format was passed, please use yyyy-mm-dd"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "404":
          description: No result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
      security:
      - ApiKey: []
  /basic-person-details/account-activation-id/{activationId}:
    get:
      summary: Get basic person details by account activation id
      description: Requires API key permissions ADMIN
      operationId: getBasicPersonDetailsByActivationId
      tags:
      - basic-person-details
      parameters:
      - description: The id of the activation to search the person
        name: activationId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Basic person details found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicPersonDetailsDTO"
        "400":
          description: Invalid account activation id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "404":
          description: No result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "409":
          description: The activation has already been used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "410":
          description: The activation has already expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
      security:
      - ApiKey: []
  /basic-person-details/reset-id/{resetId}:
    get:
      summary: Get basic person details by password reset id
      description: Requires API key permissions ADMIN
      operationId: getBasicPersonDetailsByEncryptedId
      tags:
      - basic-person-details
      parameters:
      - description: The id of the reset to search the person
        name: resetId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Basic person details found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicPersonDetailsDTO"
        "400":
          description: Invalid reset id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "404":
          description: No result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "409":
          description: The reset has already been used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "410":
          description: The reset has already expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
      security:
      - ApiKey: []
  /basic-person-details/search:
    post:
      summary: List all basic person details that matches the information in the body
      description: "Requires at least USER_OFFICE role to access this endpoint OR\
        \ an API key. Intended for looking up large numbers of people without hitting\
        \ URL length limits. A person is returned if they match ANY of the supplied\
        \ userNumbers, emails, surnames (exact match) or fedIds. Empty or omitted\
        \ lists are ignored, and a body with no values returns an empty list."
      operationId: searchBasicPersonDetails
      tags:
      - basic-person-details
      parameters:
      - description: Whether to only show searchable accounts
        example: true
        name: searchable
        in: query
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchFilter"
        required: true
      responses:
