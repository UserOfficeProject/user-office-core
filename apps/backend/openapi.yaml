        name: marketingEmail
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonDTO"
        "400":
          description: Bad request is returned if no parameters were supplied or a
            parameter is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
      security:
      - Bearer: []
      - ApiKey: []
    post:
      summary: Create a person from a PersonCreationDTO
      description: This endpoint is anonymous and does not require any authentication.
        A request for an email address that already has an account also returns 202
        Accepted.
      operationId: createPerson
      tags:
      - person
