              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "409":
          description: "Conflict is returned if duplicate records are detected while\
            \ finishing account setup after the person has been created. An email\
            \ address that already has an account is not reported here, it returns\
            \ 202 Accepted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
        "503":
          description: Error sending the activation email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDTO"
