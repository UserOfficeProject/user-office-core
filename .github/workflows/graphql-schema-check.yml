name: Graphql Schema Check
 
on:
  pull_request:
    branches: [develop]
 
jobs:
  test:
    name: Check Schema
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
 
    steps:
      - uses: actions/checkout@v6

      - uses: graphql-hive/graphql-inspector@master
        with:
          schema: 'develop:schema.graphql'
          annotations: false
          approve-label: breaking:change

