name: CI
 
on: [push]
 
jobs:
  test:
    name: Check Schema
    runs-on: ubuntu-latest
 
    steps:
      - uses: actions/checkout@v6

      - name: bring up container for schema
        run: |
          docker compose -f docker-compose-graphql-inspection.yml up -d 

          sleep 10 

          docker ps
            
      - uses: graphql-hive/graphql-inspector@master
        with:
          schema: 'http://localhost:4000/graphql'
          endpoint: 'http://localhost:4001/graphql'
