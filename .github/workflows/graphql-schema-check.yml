name: Graphql Schema Check
 
on: [push]
 
jobs:
  test:
    name: Check Schema
    runs-on: ubuntu-latest
 
    steps:
      - uses: actions/checkout@v6

      - name: Set up postgress dbs
        run: |
          docker compose -f docker-compose-graphql-inspection.yml up -d db-base db-new

          sleep 10 

          docker ps

      - name: bring up container for schema
        run: |
          docker compose -f docker-compose-graphql-inspection.yml up -d 

          sleep 20 

          docker ps
      
      - name: download graphql-inspector
        run: |
          npm i --global @graphql-inspector/cli graphql


      - name: generate base schema
        run: |
          graphql-inspector introspect http://localhost:4000/graphql > base-schema.graphql
      
      - name: generate new schema
        run: |
          graphql-inspector introspect http://localhost:4001/graphql > new-schema.graphql

      - name: graphql-inspector diff
        run: |
          echo "base schema"
          cat base-schema.graphql

      # This doesn't work see https://github.com/graphql-hive/graphql-inspector/issues/2876
      - uses: graphql-hive/graphql-inspector@master
        with:
          schema: base-schema.graphql
          endpoint: new-schema.graphql

      
      - name: manual graphql schema check
        run: |
          graphql-inspector diff http://localhost:4001/graphql http://localhost:4000/graphql

      - name: bring down containers
        run: |
          docker compose -f docker-compose-graphql-inspection.yml down