name: Build and Push Test Image

on:
  push:
    branch:
      - update-duo-message-broker-version-to-make-it-compatible-with-rabbitmq4.x

env:
  NODE_VERSION: 22.x

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Set environment variables
        run: cp apps/frontend/example.development.env apps/frontend/.env

      - name: Generate SDK
        run: npm run generate:sdk

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/backend/Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            ghcr.io/userofficeproject/user-office-backend:rmq-test

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            ghcr.io/userofficeproject/user-office-frontend:rmq-test