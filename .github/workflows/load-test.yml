name: Load testing

# Opt-in k6 load tests against the STFC configuration with the mock UOWS.
# Runs on PRs to master (hotfixes and releases), on PRs labelled "load-test",
# or manually.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [develop, master]
  # Temp test
  push:
    branches: [46-switch-to-dynamic-users-mockserver]
  workflow_dispatch:

concurrency:
  group: load-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.x

jobs:
  login:
    if: >-
      github.event_name != 'pull_request' ||
      github.base_ref == 'master' ||
      contains(github.event.pull_request.labels.*.name, 'load-test')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    env:
      TZ: Europe/London
      DATE_FORMAT: dd-MM-yyyy
      DATE_TIME_FORMAT: dd-MM-yyyy HH:mm
      PING_PUBLIC_CRT: dummypingsecret
      DEPENDENCY_CONFIG: stfc
      JWT_SECRET: qMyLZALzs229ybdQXNyzYRdju7X784TH
      NODE_ENV: development
      BASE_URL: localhost:3000
      JWT_TOKEN_LIFE: 7d
      SPARKPOST_TOKEN: dummytoken
      DATABASE_URL: postgres://duouser:duopassword@127.0.0.1:5432/duo
      USER_OFFICE_FACTORY_ENDPOINT: http://localhost:4500/generate
      USER_OFFICE_FACTORY_TAG: develop
      EXTERNAL_AUTH_TOKEN: abc
      SINK_EMAIL: BISAPPSSINK@stfc.ac.uk
      EMAIL_SENDER: '"STFC User Office" <users@stfc.ac.uk>'
      EMAIL_AUTH_HOST: exchsmtp.stfc.ac.uk
      EMAIL_TEMPLATE_PATH: /config/emails/
      EMAIL_FOOTER_IMAGE_PATH: /config/logos/STFC-Logo-small.png
      SKIP_SMTP_EMAIL_SENDING: true
      EXTERNAL_AUTH_LOGIN_URL: http://localhost:9003/auth/Login.aspx
      EXTERNAL_AUTH_LOGOUT_URL: http://localhost:9003/auth/Login.aspx
      EXTERNAL_UOWS_API_URL: http://localhost:1080/users-service
      ANTIVIRUS_HOST: clam-antivirus
      ANTIVIRUS_PORT: 3310
      ISIS_UO_EMAIL: isisuo@stfc.ac.uk
      FBS_EMAIL: FacilitiesBusinessSystem@stfc.ac.uk
      PROFILE_PAGE_LINK: http://localhost:9003/auth/ManageDetails.aspx
      EXTERNAL_AUTH_HOMEPAGE_URL: http://localhost:9003/auth/Menu.aspx
      TRANSLATION_PATH: /config/locales/

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache backend node_modules
        id: cached-node-modules-backend
        uses: actions/cache@v5
        with:
          path: apps/backend/node_modules
          key: node-modules-backend-${{ hashFiles('apps/backend/package-lock.json') }}-${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        if: steps.cached-node-modules-backend.outputs.cache-hit != 'true'
        run: npm run install:backend

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start STFC dependencies
        working-directory: apps/backend
        run: |
          docker compose -f docker-compose-stfc.e2e.yml up -d --remove-orphans
          # Docker accepts connections on the published port before Postgres is up,
          # so check from inside the container. -h forces TCP, which Postgres only
          # listens on once its init scripts have finished.
          timeout 300 bash -c 'until docker compose -f docker-compose-stfc.e2e.yml exec -T db pg_isready -h 127.0.0.1 -U duouser -d duo; do sleep 2; done'

      - name: Start backend
        working-directory: apps/backend
        run: |
          nohup node ./build/index.js > backend.log 2>&1 &
          timeout 300 bash -c 'until curl -sf http://127.0.0.1:4000/readiness > /dev/null; do sleep 5; done'

      - name: Wait for mock UOWS routes
        run: timeout 120 bash -c 'until curl -sf http://127.0.0.1:1080/mock-server/status; do sleep 2; done'

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run login load test
        run: |
          cat > "$RUNNER_TEMP/login.js" << 'EOF'
          import http from 'k6/http';
          import { check, fail } from 'k6';

          const GRAPHQL_URL = __ENV.GRAPHQL_URL || 'http://127.0.0.1:4000/graphql';
          const MOCK_SERVER_URL = __ENV.MOCK_SERVER_URL || 'http://127.0.0.1:1080';
          const USERS = parseInt(__ENV.USERS || '10');

          export const options = {
            scenarios: {
              login: { executor: 'per-vu-iterations', vus: USERS, iterations: 1 },
            },
            thresholds: {
              http_req_failed: ['rate<0.01'],
              checks: ['rate==1'],
            },
          };

          // One mock UOWS user per VU, so each VU logs in with its own session
          export function setup() {
            const res = http.post(
              `${MOCK_SERVER_URL}/mock-server/users`,
              JSON.stringify({ userCount: USERS }),
              { headers: { 'Content-Type': 'application/json' } }
            );
            if (res.status !== 201) {
              fail(`Creating mock users failed (${res.status}): ${res.body}`);
            }

            return {
              users: res.json().map((u) => ({ userNumber: u.userNumber, sessionId: u.sessionId })),
            };
          }

          export default function ({ users }) {
            const user = users[__VU - 1];
            const res = http.post(
              GRAPHQL_URL,
              JSON.stringify({
                query: `mutation ($token: String!) {
                  externalTokenLogin(externalToken: $token, redirectUri: "http://localhost:3000/external-auth")
                }`,
                variables: { token: user.sessionId },
              }),
              { headers: { 'Content-Type': 'application/json' }, tags: { name: 'externalTokenLogin' } }
            );

            // GraphQL errors come back as HTTP 200, so check the body as well
            const loggedIn = check(res, {
              'login: no GraphQL errors': (r) => !r.json('errors'),
              'login: returned a token': (r) => !!r.json('data.externalTokenLogin'),
            });
            if (!loggedIn) {
              console.error(`Login failed for user ${user.userNumber}: ${res.body}`);
            }
          }
          EOF

          k6 run "$RUNNER_TEMP/login.js"

      - name: Run proposal submission load test
        run: |
          cat > "$RUNNER_TEMP/proposal-submission.js" << 'EOF'
          import http from 'k6/http';
          import { check, fail, group, sleep } from 'k6';

          const GRAPHQL_URL = __ENV.GRAPHQL_URL || 'http://127.0.0.1:4000/graphql';
          const MOCK_SERVER_URL = __ENV.MOCK_SERVER_URL || 'http://127.0.0.1:1080';
          const USERS = parseInt(__ENV.USERS || '10');
          const DURATION = __ENV.DURATION || '2m';
          // Call seeded by the e2e DB patches, open until 2030
          const CALL_ID = parseInt(__ENV.CALL_ID || '1');

          export const options = {
            scenarios: {
              proposals: { executor: 'constant-vus', vus: USERS, duration: DURATION },
            },
            thresholds: {
              http_req_failed: ['rate<0.01'],
              checks: ['rate>0.99'],
              'http_req_duration{name:createProposal}': ['p(95)<2000'],
              'http_req_duration{name:updateProposal}': ['p(95)<2000'],
              'http_req_duration{name:submitProposal}': ['p(95)<2000'],
            },
          };

          // One mock UOWS user per VU, so each VU works as its own proposer
          export function setup() {
            const res = http.post(
              `${MOCK_SERVER_URL}/mock-server/users`,
              JSON.stringify({ userCount: USERS }),
              { headers: { 'Content-Type': 'application/json' } }
            );
            if (res.status !== 201) {
              fail(`Creating mock users failed (${res.status}): ${res.body}`);
            }

            return {
              users: res.json().map((u) => ({ userNumber: u.userNumber, sessionId: u.sessionId })),
            };
          }

          // Returns data.<name>, or null if the request failed
          function gql(name, query, variables, token) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers.Authorization = `Bearer ${token}`;

            const res = http.post(GRAPHQL_URL, JSON.stringify({ query, variables }), {
              headers,
              tags: { name },
            });

            // GraphQL errors come back as HTTP 200, so check the body as well
            const ok = check(res, {
              [`${name}: succeeded`]: (r) =>
                r.status === 200 && !r.json('errors') && r.json(`data.${name}`) != null,
            });
            if (!ok) {
              console.error(`${name} failed for VU ${__VU}: ${res.body}`);
              return null;
            }

            return res.json(`data.${name}`);
          }

          // Module scope is per VU, so each VU logs in once and reuses its token
          let token;

          export default function ({ users }) {
            if (!token) {
              token = gql(
                'externalTokenLogin',
                `mutation ($token: String!) {
                  externalTokenLogin(externalToken: $token, redirectUri: "http://localhost:3000/external-auth")
                }`,
                { token: users[__VU - 1].sessionId }
              );
              if (!token) {
                sleep(1);
                return;
              }
            }

            let proposal;
            group('create proposal', () => {
              proposal = gql(
                'createProposal',
                `mutation ($callId: Int!) {
                  createProposal(callId: $callId) { primaryKey proposalId }
                }`,
                { callId: CALL_ID },
                token
              );
            });
            if (!proposal) {
              sleep(1);
              return;
            }
            sleep(1);

            group('update proposal', () => {
              gql(
                'updateProposal',
                `mutation ($proposalPk: Int!, $title: String!, $abstract: String!) {
                  updateProposal(proposalPk: $proposalPk, title: $title, abstract: $abstract) { primaryKey }
                }`,
                {
                  proposalPk: proposal.primaryKey,
                  title: `Load test proposal ${proposal.proposalId}`,
                  abstract: `Created by k6 VU ${__VU}, iteration ${__ITER}`,
                },
                token
              );
            });
            sleep(1);

            group('submit proposal', () => {
              const submitted = gql(
                'submitProposal',
                `mutation ($proposalPk: Int!) {
                  submitProposal(proposalPk: $proposalPk) { primaryKey submitted }
                }`,
                { proposalPk: proposal.primaryKey },
                token
              );
              check(submitted, {
                'submitProposal: proposal is submitted': (p) => p !== null && p.submitted === true,
              });
            });
            sleep(1);
          }
          EOF

          k6 run "$RUNNER_TEMP/proposal-submission.js"

      - name: Backend and mock logs
        if: failure()
        working-directory: apps/backend
        run: |
          echo "===== backend ====="
          cat backend.log || true
          echo "===== mockserver-client ====="
          docker compose -f docker-compose-stfc.e2e.yml logs --no-color mockserver-client || true
