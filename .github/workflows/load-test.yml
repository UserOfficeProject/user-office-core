name: Load testing

# Opt-in k6 load tests against the STFC configuration with the mock UOWS.
# Runs on PRs to master (hotfixes and releases), on PRs labelled "load-test",
# or manually.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [develop, master]
  # Temp test
  push:
    branches: [46-switch-to-dynamic-users-mockserver]
  workflow_dispatch:

concurrency:
  group: load-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.x

jobs:
  login:
    if: >-
      github.event_name != 'pull_request' ||
      github.base_ref == 'master' ||
      contains(github.event.pull_request.labels.*.name, 'load-test')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    env:
      TZ: Europe/London
      DATE_FORMAT: dd-MM-yyyy
      DATE_TIME_FORMAT: dd-MM-yyyy HH:mm
      PING_PUBLIC_CRT: dummypingsecret
      DEPENDENCY_CONFIG: stfc
      JWT_SECRET: qMyLZALzs229ybdQXNyzYRdju7X784TH
      NODE_ENV: development
      BASE_URL: localhost:3000
      JWT_TOKEN_LIFE: 7d
      SPARKPOST_TOKEN: dummytoken
      DATABASE_URL: postgres://duouser:duopassword@127.0.0.1:5432/duo
      USER_OFFICE_FACTORY_ENDPOINT: http://localhost:4500/generate
      USER_OFFICE_FACTORY_TAG: develop
      EXTERNAL_AUTH_TOKEN: abc
      SINK_EMAIL: BISAPPSSINK@stfc.ac.uk
      EMAIL_SENDER: '"STFC User Office" <users@stfc.ac.uk>'
      EMAIL_AUTH_HOST: exchsmtp.stfc.ac.uk
      EMAIL_TEMPLATE_PATH: /config/emails/
      EMAIL_FOOTER_IMAGE_PATH: /config/logos/STFC-Logo-small.png
      SKIP_SMTP_EMAIL_SENDING: true
      EXTERNAL_AUTH_LOGIN_URL: http://localhost:9003/auth/Login.aspx
      EXTERNAL_AUTH_LOGOUT_URL: http://localhost:9003/auth/Login.aspx
      EXTERNAL_UOWS_API_URL: http://localhost:1080/users-service
      ANTIVIRUS_HOST: clam-antivirus
      ANTIVIRUS_PORT: 3310
      ISIS_UO_EMAIL: isisuo@stfc.ac.uk
      FBS_EMAIL: FacilitiesBusinessSystem@stfc.ac.uk
      PROFILE_PAGE_LINK: http://localhost:9003/auth/ManageDetails.aspx
      EXTERNAL_AUTH_HOMEPAGE_URL: http://localhost:9003/auth/Menu.aspx
      TRANSLATION_PATH: /config/locales/

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache backend node_modules
        id: cached-node-modules-backend
        uses: actions/cache@v5
        with:
          path: apps/backend/node_modules
          key: node-modules-backend-${{ hashFiles('apps/backend/package-lock.json') }}-${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        if: steps.cached-node-modules-backend.outputs.cache-hit != 'true'
        run: npm run install:backend

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start STFC dependencies
        working-directory: apps/backend
        run: |
          docker compose -f docker-compose-stfc.e2e.yml up -d --remove-orphans
          # Postgres only listens on TCP once its init scripts have finished
          timeout 300 bash -c 'until (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null; do sleep 2; done'

      - name: Start backend
        working-directory: apps/backend
        run: |
          nohup node ./build/index.js > backend.log 2>&1 &
          timeout 300 bash -c 'until curl -sf http://127.0.0.1:4000/readiness > /dev/null; do sleep 5; done'

      - name: Wait for mock UOWS routes
        run: timeout 120 bash -c 'until curl -sf http://127.0.0.1:1080/mock-server/status; do sleep 2; done'

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run login load test
        run: |
          cat > "$RUNNER_TEMP/login.js" << 'EOF'
          import http from 'k6/http';
          import { check, fail } from 'k6';

          const GRAPHQL_URL = __ENV.GRAPHQL_URL || 'http://127.0.0.1:4000/graphql';
          const MOCK_SERVER_URL = __ENV.MOCK_SERVER_URL || 'http://127.0.0.1:1080';
          const USERS = parseInt(__ENV.USERS || '10');

          export const options = {
            scenarios: {
              login: { executor: 'per-vu-iterations', vus: USERS, iterations: 1 },
            },
            thresholds: {
              http_req_failed: ['rate<0.01'],
              checks: ['rate==1'],
            },
          };

          // One mock UOWS user per VU, so each VU logs in with its own session
          export function setup() {
            const res = http.post(
              `${MOCK_SERVER_URL}/mock-server/users`,
              JSON.stringify({ userCount: USERS }),
              { headers: { 'Content-Type': 'application/json' } }
            );
            if (res.status !== 201) {
              fail(`Creating mock users failed (${res.status}): ${res.body}`);
            }

            return {
              users: res.json().map((u) => ({ userNumber: u.userNumber, sessionId: u.sessionId })),
            };
          }

          export default function ({ users }) {
            const user = users[__VU - 1];
            const res = http.post(
              GRAPHQL_URL,
              JSON.stringify({
                query: `mutation ($token: String!) {
                  externalTokenLogin(externalToken: $token, redirectUri: "http://localhost:3000/external-auth")
                }`,
                variables: { token: user.sessionId },
              }),
              { headers: { 'Content-Type': 'application/json' }, tags: { name: 'externalTokenLogin' } }
            );

            // GraphQL errors come back as HTTP 200, so check the body as well
            const loggedIn = check(res, {
              'login: no GraphQL errors': (r) => !r.json('errors'),
              'login: returned a token': (r) => !!r.json('data.externalTokenLogin'),
            });
            if (!loggedIn) {
              console.error(`Login failed for user ${user.userNumber}: ${res.body}`);
            }
          }
          EOF

          k6 run "$RUNNER_TEMP/login.js"

      - name: Backend and mock logs
        if: failure()
        working-directory: apps/backend
        run: |
          echo "===== backend ====="
          cat backend.log || true
          echo "===== mockserver-client ====="
          docker compose -f docker-compose-stfc.e2e.yml logs --no-color mockserver-client || true
