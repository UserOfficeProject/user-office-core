name: Build && Push

# Controls when the action will run
on:
  push:
    branches:
      - develop
      - native-arm64-docker-build

env:
  NODE_VERSION: 22.x
  BACKEND_IMAGE: ghcr.io/userofficeproject/user-office-backend
  FRONTEND_IMAGE: ghcr.io/userofficeproject/user-office-frontend
  PUSH: ${{ github.ref == 'refs/heads/develop' }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Each platform is built on a native runner and pushed by digest
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64/v8
            arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set environment variables
        run: cp apps/frontend/example.development.env apps/frontend/.env

      - name: Generate SDK
        run: npm run generate:sdk

      - name: Build and push backend
        id: build-backend
        uses: docker/build-push-action@v7
        with:
          context: ./
          platforms: ${{ matrix.platform }}
          file: ./apps/backend/Dockerfile
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          outputs: type=image,name=${{ env.BACKEND_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}

      - name: Build and push frontend
        id: build-frontend
        uses: docker/build-push-action@v7
        with:
          context: ./
          platforms: ${{ matrix.platform }}
          file: ./apps/frontend/Dockerfile
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          outputs: type=image,name=${{ env.FRONTEND_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}

      - name: Export digests
        if: env.PUSH == 'true'
        run: |
          mkdir -p digests
          echo "${{ steps.build-backend.outputs.digest }}" > digests/backend-${{ matrix.arch }}
          echo "${{ steps.build-frontend.outputs.digest }}" > digests/frontend-${{ matrix.arch }}

      - name: Upload digests
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  # Combines the per-platform images into multi-arch tags and triggers deployments
  merge:
    if: github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests

      - name: Create backend image tags
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          flavor: latest=true # adds :latest tag to outputs.tags
          tags: | # adds :<sha> tag to outputs.tags
            type=sha,format=long,prefix=
            type=ref,event=branch

      - name: Create frontend image tags
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          flavor: latest=true # adds :latest tag to outputs.tags
          tags: | # adds :<sha> tag to outputs.tags
            type=sha,format=long,prefix=
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push multi-arch backend image
        env:
          TAGS: ${{ steps.meta-backend.outputs.tags }}
        run: |
          docker buildx imagetools create \
            $(printf -- '-t %s ' $TAGS) \
            $(printf -- "$BACKEND_IMAGE@%s " $(cat digests/backend-*))

      - name: Push multi-arch frontend image
        env:
          TAGS: ${{ steps.meta-frontend.outputs.tags }}
        run: |
          docker buildx imagetools create \
            $(printf -- '-t %s ' $TAGS) \
            $(printf -- "$FRONTEND_IMAGE@%s " $(cat digests/frontend-*))

      - name: Trigger deployment updates at STFC
        run: |
          curl -k -l -u ${{ secrets.STFC_CI_TRIGGER_USERNAME }}:${{ secrets.STFC_CI_TRIGGER_TOKEN }} "${{ secrets.STFC_CI_TRIGGER_BASE_URL }}/Dev_Deploy_UopCore.LatestImage/build?token=${{ secrets.STFC_CI_TRIGGER_URL_TOKEN }}"

      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.AUTOPRFLOW_APP_ID }}
          private-key: ${{ secrets.AUTOPRFLOW_APP_PRIVATE_KEY }}
          repositories: user-office-scheduler

      - name: Trigger user-office-scheduler's generate-sdk workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.everest-preview+json" \
            -H "Authorization: token ${{ env.APP_TOKEN }}" \
            -d '{"event_type": "generate-sdk"}' \
            https://api.github.com/repos/UserOfficeProject/user-office-scheduler/dispatches
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
